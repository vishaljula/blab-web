name: Blab CI Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: Expo TypeScript & Paired-File Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Expo dependencies
        working-directory: expo-app
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Expo TypeScript Check
        working-directory: expo-app
        run: npx tsc --noEmit

      # AUDIT-001 / T3 — structural accessibility guard. Fails if a guarded Flow #1 file
      # adds a control without a label and a role, or reaches past the accessible wrappers
      # for a raw Pressable / TouchableOpacity / TextInput.
      - name: Run Accessibility Structural Guard
        run: node scripts/a11y-guard.mjs

      - name: Verify Protected Governance Files Exist
        run: |
          test -f CLAUDE.md
          test -f PROTECTED_SURFACES.md
          echo "Governance files verified."
